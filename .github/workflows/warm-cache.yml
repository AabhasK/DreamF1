name: Warm Telemetry Cache

# Pre-fetches the latest completed round's telemetry after each race weekend
# so the first real user never eats the slow FastF1 cold load. Hitting the
# public endpoints warms BOTH caches: FastF1's disk cache (persisted in the
# ff1cache Docker volume) and the backend's in-process session cache.

on:
  schedule:
    # Races run Sundays (UTC end times vary from ~08:00 Vegas to ~21:00 Americas).
    # Two passes: late Sunday catches most races, Monday morning catches the rest
    # and re-warms the in-process cache if the container restarted overnight.
    - cron: "0 23 * * 0"
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  warm:
    # Skipped while the EC2 backend is switched off (see deploy.yml).
    if: vars.BACKEND_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Warm latest completed round
        env:
          API: http://${{ secrets.EC2_HOST }}:8080
        run: |
          python3 - <<'EOF'
          import json, os, sys, time, urllib.request
          from datetime import datetime, timezone

          api = os.environ["API"]

          def get(path, timeout=900):
              req = urllib.request.Request(api + path, headers={"User-Agent": "warm-cache"})
              t0 = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      body = r.read()
                      print(f"OK   {path}  ({len(body)/1024:.0f} kB, {time.time()-t0:.1f}s)", flush=True)
                      return json.loads(body)
              except Exception as e:
                  print(f"FAIL {path}: {e}", flush=True)
                  return None

          sched = get("/api/schedule", timeout=120)
          if not sched:
              sys.exit(1)

          now = datetime.now(timezone.utc).replace(tzinfo=None)

          def race_start(e):
              raw = e.get("session5_date") or (e["event_date"] + "T12:00:00")
              return datetime.fromisoformat(raw.replace("Z", ""))

          past = [e for e in sched if race_start(e) <= now]
          if not past:
              print("No completed rounds yet — nothing to warm.")
              sys.exit(0)

          latest = max(past, key=lambda e: e["round_number"])
          rnd = latest["round_number"]
          print(f"Warming R{rnd} · {latest['event_name']}", flush=True)

          # Sequential on purpose — parallel FastF1 loads can OOM the t3.small.
          base = f"/api/telemetry/2026/{rnd}"
          endpoints = [
              "race_summary", "quali", "tyres",          # eager tab loads
              "laptimes", "race_pace", "positions",
              "gaps", "sector_times", "weather",
              "race_control",
              "speed", "map",                            # telemetry=True — heaviest last
          ]
          failed = [ep for ep in endpoints if get(f"{base}/{ep}") is None]

          # Dashboard + standings aggregates for the new round
          get(f"/api/circuit_history/2026/{rnd}")
          get("/api/standings/2026")

          if failed:
              print(f"\n{len(failed)} endpoint(s) failed: {', '.join(failed)}")
              sys.exit(1)
          print("\nAll warm.")
          EOF
