# Production stack on EC2 (db + backend). deploy.yml copies this file to
# /opt/myf1circle/docker-compose.yml, next to the server-only .env it reads.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # Caps db's cgroup so a runaway query OOMs the container (auto-restarts via
    # `restart: unless-stopped`), not an arbitrary host process like sshd — see
    # "Intermittent outages" / "SSH Connection reset by peer" incidents in CLAUDE.md.
    # 150m covers observed usage (~42MB) with headroom; leaves the rest of the
    # 916MB-usable t3.micro for backend + host OS.
    mem_limit: 150m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${ECR_REGISTRY}/myf1circle-backend:${IMAGE_TAG}
    restart: unless-stopped
    # 650m covers the observed single-round FastF1 peak (~520MB for two rounds
    # pre-fix; the app-level session cache now evicts to one round, ~390MB seen)
    # plus request overhead, while still leaving the host OS/sshd their own room.
    mem_limit: 650m
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # These override/add to .env — backend must reach db via service name, not localhost
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ff1cache:/app/cache

volumes:
  pgdata:
  ff1cache:
