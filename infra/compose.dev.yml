# Local full stack: Postgres + FastAPI + Next.js + Streamlit prototype.
# Run from the repo root:  docker compose -f infra/compose.dev.yml up --build
# `name` pins the project (and volume) names so they don't become "infra_*".
name: myf1circle

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: f1user
      POSTGRES_PASSWORD: f1pass
      POSTGRES_DB: f1db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1user -d f1db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # IMAGE_TAG is set by the deploy workflow (github.sha). Falls back to
    # building locally when IMAGE_TAG is unset (local dev).
    image: ${ECR_REGISTRY:-local}/myf1circle-backend:${IMAGE_TAG:-local}
    build: ../backend
    ports:
      - "8080:8080"
    environment:
      POSTGRES_USER: f1user
      POSTGRES_PASSWORD: f1pass
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: f1db
      SECRET_KEY: change-me-in-production
      ALGORITHM: HS256
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ff1cache:/app/cache

  streamlit:
    build: ../frontend-prototype
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8080
    depends_on:
      - backend

  nextjs:
    build: ../frontend
    ports:
      - "3000:3000"
    environment:
      # Browser calls go to relative /api/*; the Next.js API route proxies them here
      DEMO_MODE: "false"
      API_URL: http://backend:8080
    depends_on:
      - backend


volumes:
  pgdata:
  ff1cache:

